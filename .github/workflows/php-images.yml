name: Build and Push Unofficial filc-php Docker Images

on:
  workflow_dispatch:
    inputs:
      filc_channel:
        description: "Fil-C ports channel version"
        required: false
        default: "0.1.7"
        type: string
      push:
        description: "Push verified images to Docker Hub"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "docker/php/**"
      - ".github/workflows/php-images.yml"

concurrency:
  group: php-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: php-${{ matrix.php_series }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - php_series: "8.5"
            php_full: "8.5.13"
            variant: "cli"
            is_latest: true
            support: "active"
          - php_series: "8.5"
            php_full: "8.5.13"
            variant: "fpm"
            is_latest: false
            support: "active"
          - php_series: "8.4"
            php_full: "8.4.28"
            variant: "cli"
            is_latest: false
            support: "active"
          - php_series: "8.4"
            php_full: "8.4.28"
            variant: "fpm"
            is_latest: false
            support: "active"
          - php_series: "8.3"
            php_full: "8.3.37"
            variant: "cli"
            is_latest: false
            support: "active"
          - php_series: "8.3"
            php_full: "8.3.37"
            variant: "fpm"
            is_latest: false
            support: "active"
          - php_series: "8.2"
            php_full: "8.2.36"
            variant: "cli"
            is_latest: false
            support: "active"
          - php_series: "8.2"
            php_full: "8.2.36"
            variant: "fpm"
            is_latest: false
            support: "active"

    env:
      IMAGE_NAME: jonasborchelt/filc-php
      FILC_CHANNEL: ${{ inputs.filc_channel || '0.1.7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags and OCI labels
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          series="${{ matrix.php_series }}"
          full="${{ matrix.php_full }}"
          variant="${{ matrix.variant }}"
          is_latest="${{ matrix.is_latest }}"
          support="${{ matrix.support }}"
          channel="${FILC_CHANNEL}"

          tags=(
            "${IMAGE_NAME}:${series}-${variant}"
            "${IMAGE_NAME}:${full}-${variant}"
          )
          if [ "$variant" = "cli" ]; then
            tags+=(
              "${IMAGE_NAME}:${series}"
              "${IMAGE_NAME}:${full}"
            )
            if [ "$is_latest" = "true" ]; then
              tags+=("${IMAGE_NAME}:latest")
            fi
          fi

          local_tag="filc-php-smoke:${series}-${variant}"
          echo "local_tag=${local_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.created=${created}"
            echo "org.opencontainers.image.title=Unofficial PHP ${series} (${variant}) built with Fil-C"
            echo "org.opencontainers.image.description=Unofficial PHP built with Fil-C (memory-safe). Toolchain and ports: https://filc.connected.link"
            echo "org.opencontainers.image.url=https://filc.connected.link"
            echo "org.opencontainers.image.documentation=https://filc.connected.link"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.version=${full}"
            echo "org.opencontainers.image.licenses=PHP-3.01 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND MIT"
            echo "dev.filc.channel=${channel}"
            echo "dev.filc.php.series=${series}"
            echo "support=${support}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php_series }}
            PHP_FULL_VERSION=${{ matrix.php_full }}
            FILC_CHANNEL=${{ env.FILC_CHANNEL }}
            FILC_BASE_URL=https://filc.connected.link
            FILC_USER_AGENT=filc-image-ci/${{ matrix.php_series }}
            SUPPORT_TIER=${{ matrix.support }}

      - name: Smoke-test and drop-in acceptance test before push
        shell: bash
        run: |
          set -euo pipefail
          bash docker/php/smoke.sh "${{ steps.meta.outputs.local_tag }}" "${{ matrix.php_series }}" "${{ matrix.variant }}"

      - name: Log in to Docker Hub
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image to Docker Hub
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ matrix.php_series }}
            PHP_FULL_VERSION=${{ matrix.php_full }}
            FILC_CHANNEL=${{ env.FILC_CHANNEL }}
            FILC_BASE_URL=https://filc.connected.link
            FILC_USER_AGENT=filc-image-ci/${{ matrix.php_series }}
            SUPPORT_TIER=${{ matrix.support }}

  sync-dockerhub-overview:
    name: Update Docker Hub repository overview
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.push)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub description and README (best-effort if token permits)
        continue-on-error: true
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: jonasborchelt/filc-php
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Skipping Docker Hub overview sync (credentials unavailable)."
            exit 0
          fi
          login_payload="$(python3 -c 'import json, os; print(json.dumps({"username": os.environ["DOCKERHUB_USERNAME"], "password": os.environ["DOCKERHUB_TOKEN"]}))')"
          jwt="$(curl -fsSL -X POST -H "Content-Type: application/json" -d "$login_payload" "https://hub.docker.com/v2/users/login/" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("token", ""))')"
          if [ -z "$jwt" ]; then
            echo "Warning: Docker Hub login did not return a JWT (scoped PAT may not allow repository metadata updates)." >&2
            exit 0
          fi
          patch_payload="$(python3 -c '
          import json
          with open("docker/php/README.md", "r", encoding="utf-8") as f:
              readme = f.read()
          print(json.dumps({
              "description": "Unofficial PHP built with Fil-C (memory-safe). Toolchain and ports: https://filc.connected.link",
              "full_description": readme,
          }))
          ')"
          http_code="$(curl -sSL -o /tmp/hub-patch.json -w "%{http_code}" -X PATCH \
            -H "Authorization: JWT ${jwt}" \
            -H "Content-Type: application/json" \
            -d "$patch_payload" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/")"
          echo "Docker Hub overview PATCH status: HTTP ${http_code}"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Warning: Docker Hub overview update returned HTTP ${http_code} (token scope may be push-only)." >&2
          fi
